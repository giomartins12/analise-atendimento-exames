[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analise-atendimento-exames"
version = "0.1.0"
description = "Painel local de analise operacional de atendimentos e exames"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2,<3.0",
  "plotly>=5.24,<7.0",
  "streamlit>=1.41,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

